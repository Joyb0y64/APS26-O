<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | GitHub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            max-width: 450px;
            width: 100%;
            padding: 32px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #58a6ff;
            margin-bottom: 16px;
        }

        h1 {
            color: #f0f6fc;
            font-size: 1.5rem;
            margin-bottom: 4px;
        }

        .username {
            color: #8b949e;
            font-size: 1rem;
            margin-bottom: 16px;
        }

        .bio {
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 24px;
            color: #8b949e;
        }

        .btn {
            display: inline-block;
            background-color: #238636;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Reemplaza con el enlace a tu foto de perfil o avatar -->
        <img class="profile-img" src="https://github.com/identicons/user.png" alt="Foto de perfil">
        
        <!-- Reemplaza con tu nombre y tu usuario -->
        <h1>Tu Nombre</h1>
        <p class="username">@tu_usuario</p>
        
        <!-- Una pequeña descripción personal o sobre tus proyectos -->
        <p class="bio">
            Desarrollador enfocado en aprender nuevas tecnologías, crear proyectos geniales y colaborar en código abierto.
        </p>

        <!-- Reemplaza el enlace con la URL exacta de tu perfil de GitHub -->
        <a class="btn" href="https://github.com/tu_usuario" target="_blank" rel="noopener noreferrer">
            Ver perfil en GitHub
        </a>
    </div>

</body>
</html>
